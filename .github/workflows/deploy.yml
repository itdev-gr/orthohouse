name: Deploy to Hetzner

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /home/runner/orthohousecy

    steps:
      - name: Pull latest
        run: git pull

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          STOREFRONT_TOKEN: ${{ secrets.STOREFRONT_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_API_VERSION: ${{ secrets.SHOPIFY_API_VERSION }}
          SHOPIFY_PRIVATE_TOKEN: ${{ secrets.SHOPIFY_PRIVATE_TOKEN }}

      - name: Deploy
        run: sudo rsync -rlptv --delete dist/ /var/www/testortho/
